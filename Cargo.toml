[package]
name = "tahti-radio-discord-bot"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/janiluuk/tahti-radio-discord-bot"

[dependencies]
async-trait = "0.1.89"
dotenvy = "0.15.7"
envy = "0.4.2"
rand = "0.9"
serde = { version = "1.0.228", features = ["derive"] }
serenity = "0.12.5"
songbird = "0.6.0"
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
